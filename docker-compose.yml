services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bunker
      POSTGRES_USER: bunker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Create .env first}
    volumes:
      - bunker_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bunker -d bunker"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_HOST: db
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Create .env first}
      MAX_ROOMS: ${MAX_ROOMS:-2}
    depends_on:
      db:
        condition: service_healthy
  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "0.0.0.0:${PORT:-8080}:80"
    depends_on:
      - api
volumes:
  bunker_db:
